<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>State</title>
    <style>
        .container {
            display: grid;
            min-height: 650px; 
            width: 650px;
            border: 2px solid #333;
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: 1fr 2fr 1fr;
            gap: 15px; 
            padding: 15px;
            background-color: rgb(14, 1, 1);
            border-radius: 15px; 
            box-sizing: border-box;
        }
        .container > div {
            border: 1px solid  white; 
            border-radius: 8px;
            display: grid; 
        }
        .color-block {
            background-color: yellow;
            width: 50px;
            height: 50px;
            border-radius: 4px;
        }
        .item-1 {
            align-items: end;
            justify-content: end;
        }
        .item-2 {
            align-items: center;
            justify-content: center;
        }
        .item-3 {
            align-items: start;
            justify-content: end;
        }
        .item-4, .item-6, .item-9 {
            align-items: center;
            justify-content: start;
        }
        .item-5 {
            align-items: center;
            justify-content: end;
        }
        .item-7 {
            align-items: end;
            justify-content: start;
        }
        .item-8 {
            align-items: start;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="item-1"><div class="color-block"></div></div>
        <div class="item-2"><div class="color-block"></div></div>
        <div class="item-3"><div class="color-block"></div></div>
        <div class="item-4"><div class="color-block"></div></div>
        <div class="item-5"><div class="color-block"></div></div>
        <div class="item-6"><div class="color-block"></div></div>
        <div class="item-7"><div class="color-block"></div></div>
        <div class="item-8"><div class="color-block"></div></div>
        <div class="item-9"><div class="color-block"></div></div>
    </div>

</body>
</html>
