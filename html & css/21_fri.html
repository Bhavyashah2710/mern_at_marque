<!DOCTYPE html>
<html>
<head>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #eee;
      display: flex;
    }
    .box {
      width: 120px;
      height: 340px;
      background: black;
      padding: 15px;
    }
    .circle {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      margin: 15px auto;
    }
    .red { background: red; }
    .yellow { background: yellow; }
    .green { background: green; }
  </style>
</head>
<body>

  <div class="box">
    <div class="circle red"></div>
    <div class="circle yellow"></div>
    <div class="circle green"></div>
  </div>

</body>
</html>
