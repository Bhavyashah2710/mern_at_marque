<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform Demo</title>

    <style>
        #myButton {
            width: 100px;
            height: 50px;
            position: absolute;
            left: 0;
            top: 20%;

            background-color: white;
            border: 2px solid black;
            border-radius: 0;

            transition: all 3s ease;

            /* Initial State */
            transform: translateY(-50%);
        }

        #myButton.center {
            left: 50%;

            background-color: blue;
            color: white;
            border-radius: 25px;

            /* Move + Scale + Rotate */
            transform: translate(-50%, -50%) scale(1.5) rotate(7200deg);
        }
    </style>
</head>
<body>

    <button id="myButton">Click Me</button>

    <script>
        const button = document.getElementById("myButton");

        button.addEventListener("click", () => {
            button.classList.toggle("center");
        });
        
    </script>

</body>
</html>
