<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .conatainer{
            display: grid;
            grid-template-columns: 200px 1fr 200px;
            grid-template-rows: 80px 1fr 60px;
            grid-template-areas: 
                "header header header"
                "sidebar main aside"
                "footer footer footer";
                gap: 12px;
                height: 100vh;
        }
        .header{ grid-area: header; border: 1px solid #ccc;background-color: rgba(26, 4, 223, 0.95); color: #333; display: flex; justify-content: center; align-items: center;   }
        .sidebar{ grid-area: sidebar; border: 1px solid #ccc;background-color: rgba(8, 228, 162, 0.95); color: #333; display: flex; justify-content: center; align-items: center;   }
        .main{ grid-area: main; border: 1px solid #ccc;,background-color: rgba(3, 223, 26, 0.95) ; color: #333; display: flex; justify-content: center; align-items: center;   }
        .aside{ grid-area: aside; border: 1px solid #ccc;background-color: rgba(221, 183, 16, 0.95); color: #333; display: flex; justify-content: center; align-items: center;   }
        .footer{ grid-area: footer; border: 1px solid #ccc;background-color: rgba(248, 11, 11, 0.95); color: #333; display: flex; justify-content: center; align-items: center;   }
    </style>
</head>
<body>
    <div class="conatainer">
        <div class="header">Header</div>
        <div class="sidebar">Sidebar</div>
        <div class="main">Main Content</div>
        <div class="aside">Aside</div>
        <div class="footer">Footer</div>
    </div>
</body>
</html>
