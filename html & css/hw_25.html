<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .wrapper {
            width: 100%;
            max-width: 1100px;
            background-color: #ffffff;
            border: 2px solid #333333;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 15px;
        }

        .item {
            background-color: #f0f0f0;
            border: 2px solid #cccccc;
            border-radius: 4px;
            min-height: 40px;
        }

        .row-1 {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .size-s { width: 40px; flex-shrink: 0; }
        .size-m { width: 100px; flex-shrink: 0; }
        .size-l { flex-grow: 1; }
        .size-icon { width: 35px; flex-shrink: 0; }

        .row-2 {
            display: grid;
            grid-template-columns: 40px repeat(4, 1fr) 60px;
            gap: 12px;
        }

        .row-3 {
            display: grid;
            grid-template-columns: 40px 1.5fr 2fr 1.2fr;
            gap: 12px;
        }
        .row-3 .item {
            min-height: 200px;
        }
        .row-3 .side {
            min-height: 40px;
            grid-column: 1;
        }

        .row-4 {
            display: grid;
            grid-template-columns: 40px 1.5fr 3.2fr;
            gap: 12px;
            padding-bottom: 20px;
        }
        .row-4 .bottom-block {
            min-height: 100px;
        }

        @media (max-width: 768px) {
            .row-2 {
                grid-template-columns: repeat(3, 1fr);
            }
            .row-3, .row-4 {
                grid-template-columns: 1fr;
            }
            .side, .size-s, .size-icon {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        
        <div class="row-1">
            <div class="item size-s"></div>
            <div class="item size-m"></div>
            <div class="item size-l"></div>
            <div class="item size-icon"></div>
            <div class="item size-icon"></div>
            <div class="item size-icon"></div>
        </div>

        <div class="row-2">
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
        </div>

        <div class="row-3">
            <div class="item size-s"></div>            
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
        </div>

        <div class="row-4">
            <div class="item side"></div>
            <div class="item bottom-block"></div>
        </div>

    </div>

</body>
</html>
