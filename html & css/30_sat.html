<!DOCTYPE html>
<html>
<head>
  <style>
    .Container{
         display : grid;
           grid-template-columns : 200px 200px 200px 200px 200px;
           grid-template-rows : 100px 100px 100px 100px 100px;        
              gap : 16px;   
    }
    .item{
        background-color : #f30808;      
        color : white;
        padding : 16px;
    }
    .Container2{
            display : grid;
            grid-template-columns : 100px 200px 100px;                
                gap : 16px;
                margin-top : 16px;
    }
    .item2{
        background-color : #f30808;      
        color : white;
        padding : 16px;
    }
    .Container3{
            display : grid;
            grid-template-columns : 1fr 2fr 1fr;                
                gap : 16px;
                margin-top : 16px;
    }
    .item3{
        background-color : #f30808;      
        color : white;
        padding : 16px;
    }
     .Container4{
            display : grid;
            grid-template-columns : repeat(4, 1fr);                
                gap : 16px;
                margin-top : 16px;
    }
    .item4{
        background-color : #f30808;      
        color : white;
        padding : 16px;
    }
     .Container5{
            display : grid;
            grid-template-columns : 200px 1fr auto ;                
                gap : 16px;
                margin-top : 16px;
    }
    .item5{
        background-color : #f30808;      
        color : white;
        padding : 16px;
    }
  </style>
</head>
<body>
    <div class = "Container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
        <div class="item">7</div>
        <div class="item">8</div>
        <div class="item">9</div>
        <div class="item">10</div>
        <div class="item">11</div>
        <div class="item">12</div>
        <div class="item">13</div>
        <div class="item">14</div>
        <div class="item">15</div>
        <div class="item">16</div>
        <div class="item">17</div>
        <div class="item">18</div>
        <div class="item">19</div>
        <div class="item">20</div>
        <div class="item">21</div>
        <div class="item">22</div>
        <div class="item">23</div>
        <div class="item">24</div>
        <div class="item">25</div>          
    </div>
    <div class = "Container2">
        <div class="item2">26</div>
        <div class="item2">27</div>
        <div class="item2">28</div>
    </div>
    <div class = "Container3">
        <div class="item3">29</div>
        <div class="item3">30</div>
        <div class="item3">31</div>
    </div>
    <div class = "Container4">
        <div class="item4">32</div>
        <div class="item4">33</div>
        <div class="item4">34</div>
        <div class="item4">35</div>
    </div>
    <div class = "Container5">
        <div class="item5">36</div>
        <div class="item5">37</div>
        <div class="item5">38</div>
    </div>
</body>
</html>
