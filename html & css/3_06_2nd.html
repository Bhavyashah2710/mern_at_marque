<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter B</title>
    <style>
        .container {
            display: grid;
            min-height: 650px; 
            width: 650px;
            border: 2px solid #333;
            border-radius: 15px; 
            padding: 15px;
            box-sizing: border-box;
            gap: 10px;
            background-color: white;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(7, 1fr);
            
            grid-template-areas: 
                "x1 x2 x2 x2 ."
                "x1 .  .  .  x5"
                "x1 .  .  .  x5"
                "x1 x3 x3 x3 ."
                "x1 .  .  .  x6"
                "x1 .  .  .  x6"
                "x1 x4 x4 x4 .";
        }

        .container > div {
            background-color: #3498db;
            border: 1px solid #050000;
            border-radius: 6px;
        }

        .x1 { grid-area: x1; }
        .x2 { grid-area: x2; }
        .x3 { grid-area: x3; }
        .x4 { grid-area: x4; }
        .x5 { grid-area: x5; }
        .x6 { grid-area: x6; }
    </style>
</head>
<body>

    <div class="container">
        <div class="x1"></div>
        <div class="x2"></div>
        <div class="x3"></div>
        <div class="x4"></div>
        <div class="x5"></div>
        <div class="x6"></div>
    </div>

</body>
</html>
