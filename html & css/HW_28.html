<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>
    <style>
        .body{
           display: flex;
            height: 50px;
            width: 800px;
            border-radius: 5px;
            border: 2px solid black;
            background-color: #342c2c46;
            flex-direction: row;
            justify-content: flex-end;
            align-items: center;
            flex-wrap: wrap;
        }
        .item {
            background-color: #343a4276;
            height: 20px;
            width: 20px;
            border-radius: 5px;
            margin: 5px;

        }
    </style>
</head>
<body>
    <div class="body">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>
</body>
</html>
