<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>State</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            grid-template-areas:
                "KM KM MP MP"
                "KM KM MP MP"
                "RJ RJ RJ RJ"
                "BH BH UP UP";
            gap: 12px;
            height: 700px;
            width: 700px;
            border: 2px solid black;
        }
        .KM{
            display: flex;
            justify-content: center;
            align-items: center;
            grid-area: KM;
            border: 2px solid black;
            background-color: blue;
        }
        .RJ{
            display: flex;
            justify-content: center;
            align-items: center;
            grid-area: RJ;
            border: 2px solid black;
            background-color: limegreen;
        }
        .MP{
            display: flex;
            justify-content: center;
            align-items: center;
            grid-area: MP;
            border: 2px solid black;
            background-color: purple;
        }
        .BH{
            display: flex;
            justify-content: center;
            align-items: center;
            grid-area: BH;
            border: 2px solid black;
            background-color: orange;
        }
        .UP{
            display: flex;
            justify-content: center;
            align-items: center;
            grid-area: UP;
            border: 2px solid black;
            background-color: skyblue;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="KM">
            <h1>Kashmir</h1>
        </div>
        <div class="RJ">
            <h1>Rajasthan</h1>
        </div>
        <div class="MP">
            <h1>Madhya Pradesh</h1>
        </div>
        <div class="BH">
            <h1>Bihar</h1>
        </div>
        <div class="UP">
            <h1>Uttar Pradesh</h1>
        </div>
    </div>    
</body>
</html>
