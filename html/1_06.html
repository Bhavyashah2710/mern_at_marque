<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codolio Profile Card</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        body {
            background-color: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background-color: #ffffff;
            width: 360px;
            height : 450px;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.1);
        }
        .card-banner {
            height: 110px;
            background: linear-gradient(135deg, #2575fc, #1a365d);
        }
        .card-content {
            padding: 0 24px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .profile-container {
            margin-top: -65px;
        }
        .avatar {
            width: 120px;
            height: 120px;
            background-color: #f5f5f5;
            border: 5px solid #ffffff; 
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            font-weight: bold;
            color: #111;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .metrics-container {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            background-color: #f8f9fa;
            border-radius: 16px;
            padding: 12px 0;
        }
        .metric-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #333333; /* Dark color taaki white background par dikhe */
        }
        .metric-icon {
            font-size: 16px;
            color: #777;
        }
        .metric-count {
            font-size: 16px;
            font-weight: bold;
        }
        .metric-label {
            font-size: 11px;
            color: #888;     
            text-transform: uppercase;
        }
        .platforms-box {
            width: 100%;
            text-align: center;
        }
        .section-title {
            color: #888;
            font-size: 12px;
            margin-bottom: 10px;
        }
        .platform-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 22px;
        }
        .icon-hr { color: #2ecc71; }
        .icon-gfg { color: #27ae60; }
        .icon-cc { color: #f39c12; }
        .icon-chef { color: #bdc3c7; }
        .icon-lc { color: #f1c40f; }

        .tags-container {
            display: flex;
            gap: 12px;
            width: 100%;
        }
        .tag {
            flex: 1;
            text-align: center;
            background-color: blue;
            color: #fff;
            padding: 10px 0;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-banner"></div>

        <div class="card-content">
            <div class="profile-container">
                <div class="avatar">B</div>            
            </div>
            
            <div class="platforms-box">
                <p class="section-title">You can find me on ...</p>
                <div class="platform-icons">
                    <i class="fab fa-hackerrank icon-hr" title="HackerRank"></i>
                    <i class="fas fa-code icon-gfg" title="GeeksforGeeks"></i>
                    <i class="fas fa-chart-bar icon-cc" title="CodeForces"></i>
                    <i class="fas fa-hamburger icon-chef" title="CodeChef"></i>
                    <i class="fas fa-terminal icon-lc" title="LeetCode"></i>
                </div>
            </div>

            <div class="tags-container">
                <span class="tag">Subscribe</span>
                <span class="tag">Message</span>
            </div> 
            <div class="metrics-container">
                <div class="metric-box">
                    <span class="metric-count">1.2K</span>
                    <span class="metric-label">Likes</span>
                </div>
                <div class="metric-box">
                    <span class="metric-count">428</span>
                    <span class="metric-label">Comments</span>
                </div>
                <div class="metric-box">
                    <span class="metric-count">89</span>
                    <span class="metric-label">Shares</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
