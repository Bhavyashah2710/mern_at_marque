<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Dashboard Layout - Internal CSS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: black; 
            font-family: Arial, sans-serif;
        }

        .container {
            min-height: 650px; 
            width: 650px;
            border: 2px solid #333;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 15px; 
            padding: 15px;
            background-color: rgb(4, 0, 12);
            border-radius: 15px; 
        }
        .box {
            background-color: rgba(33, 2, 54, 0.7); 
            border-radius: 10px;
            color: white;
            position: relative; 
            box-sizing: border-box;
            padding: 15px;
        }
        .platforms-box {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .platform-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 24px;
        }
        .icon-hr { color: #2ecc71; }
        .icon-gfg { color: #27ae60; }
        .icon-cc { color: #f39c12; }
        .icon-chef { color: #bdc3c7; }
        .icon-lc { color: #f1c40f; }
        .metric-value-centered {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
        }
        .big-text {
            font-size: 50px;
            font-weight: bold;
        }
        .small-text {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }
        /* .box-with-label-tl-value-br {
        } */
        .label-tl {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 14px;
            opacity: 0.8;
        }
        .value-br {
            position: absolute;
            bottom: 15px;
            right: 15px;
            font-size: 50px;
            font-weight: bold;
            text-align: center;
            padding-right: 40px;
            padding-bottom: 45px;
        }

        .design-box {
            background-color: rgba(43, 7, 241, 0.6); /* Design specific blue */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: bold;
        }
        .desc-box {
            background-color: rgba(33, 2, 54, 0.7);
            grid-column: 1 / 3;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-radius: 10px;
        }
        .item7 {
            background-color: rgba(255, 255, 255, 0.95); 
            color: #333; 
            grid-column: 3 / -1; 
            grid-row: 2 / 4; 
            display: block; 
            position: relative;
        }
        .item7-label-tl {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 16px;
            font-weight: bold;
            color: #555;
        }
        .item7-value-br {
            position: absolute;
            bottom: 15px;
            right: 15px;
            font-size: 60px;
            font-weight: bold;
            color: black;
            text-align: center;
            padding-right: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box platforms-box">
            <div class="platform-icons">
                <i class="fab fa-hackerrank icon-hr" title="HackerRank"></i>
                <i class="fas fa-code icon-gfg" title="GeeksforGeeks"></i>
                <i class="fas fa-chart-bar icon-cc" title="CodeForces"></i>
                <i class="fas fa-hamburger icon-chef" title="CodeChef"></i>
                <i class="fas fa-terminal icon-lc" title="LeetCode"></i>
            </div>
        </div>
        <div class="box">
            <div class="metric-value-centered">
                <div class="big-text">25k</div>
                <div class="small-text">weekly likes</div>
            </div>
        </div>
        <div class="box">
            <div class="metric-value-centered">
                <div class="big-text">50k</div>
                <div class="small-text">weekly views</div>
            </div>
        </div>

        <div class="box box-with-label-tl-value-br">
            <div class="label-tl">active users</div>
            <div class="value-br">1538</div>
        </div>
        <div class="box design-box">DESIGN</div>

        <div class="box desc-box">A place to learn UI & Web Design.</div>

        <div class="box item7">
            <div class="item7-label-tl">total suscriber</div>
            <div class="item7-value-br">200k</div>
        </div>
    </div>
</body>
</html>
