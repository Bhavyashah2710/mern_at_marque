<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f0f0f0;
        margin: 0;
    }
    .wireframe-card {
        border: 2px solid #333;
        padding: 20px;
        width: 500px;
        background-color: #fff;
        display: flex;
        flex-direction: column;
        gap: 20px; 
        background-color: #627f86;
    }
    .top-section {
        display: flex;
        gap: 15px;
    }
    .shape-circle {
        width: 60px;
        height: 60px;
        border: 2px solid #333;
        border-radius: 50%; 
        background-color: #a6ec03;
    }
    .shape-rectangle {
        flex: 1; 
        height: 60px;
        border: 2px solid #333;
        background-color: #590dd4;
    }
    .middle-section {
        display: flex;
        gap: 15px;
    }
    .shape-square {
        width: 60px;
        height: 60px;
        border: 2px solid #333;
        background-color: #04d663;
    }
    .bottom-section {
        display: flex;
        align-items: center;
        gap: 120px;
     }
     .shape-rectangle-2 {
        flex: 1.5; 
        height: 100px;
        border: 2px solid #333;
        background-color: #590dd4; 
     }
</style>
</head>
<body>
    <div class="wireframe-card">
        <div class="top-section">
            <div class="shape-circle"></div>
            <div class="shape-rectangle"></div>
        </div>
        <div class="middle-section">
            <div class="shape-square"></div>
            <div class="shape-rectangle-2"></div>
        </div>
        <div class="bottom-section">
            <div class="shape-rectangle-2"></div>
            <div class="shape-rectangle-2"></div>
            <div class="shape-rectangle-2"></div>
        </div>
</body>
</html>
</body>
</html>
