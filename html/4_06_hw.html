<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Grid Layout</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(8, 72.5px);
            gap: 12px;
            grid-template-areas: 
                "sidebar topnav topnav topnav"
                "sidebar User Reservation Orders"
                "sidebar User Reservation Orders"
                "sidebar chart chart table"
                "sidebar chart chart table"
                "sidebar chart chart table"
                "sidebar widget1 widget2 widget3"
                "sidebar widget1 widget2 widget3";
            height: 650px;
            width: 850px;
            background-color: #ffffff;
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            box-sizing: border-box;
            margin: auto;
        }

        .container > div {
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 600;
            font-size: 15px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .container > div:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .sidebar {
            grid-area: sidebar;
            background-color: #1e293b;
            color: #ffffff;
        }

        .topnav {
            grid-area: topnav;
            background-color: #0f766e;
            color: #ffffff;
        }

        .User {
            grid-area: User;
            background-color: #e0f2fe;
            color: #0369a1;
        }

        .Reservation {
            grid-area: Reservation;
            background-color: #dcfce7;
            color: #15803d;
        }

        .Orders {
            grid-area: Orders;
            background-color: #ffedd5;
            color: #c2410c;
        }

        .chart {
            grid-area: chart;
            background-color: #eef2ff;
            color: #4f46e5;
            font-size: 40px !important;
        }

        .table {
            grid-area: table;
            background-color: #f3e8ff;
            color: #6b21a8;
        }

        .widget1, .widget2, .widget3 {
            background-color: #f1f5f9;
            color: #475569;
        }

        .widget1 { grid-area: widget1; }
        .widget2 { grid-area: widget2; }
        .widget3 { grid-area: widget3; }
    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar">Sidebar</div>
        <div class="topnav">Top Navigation</div>
        <div class="User">User</div>
        <div class="Reservation">Reservation</div>
        <div class="Orders">Orders</div>
        <div class="chart">Chart</div>
        <div class="table">Table</div>
        <div class="widget1">Widget 1</div>
        <div class="widget2">Widget 2</div>
        <div class="widget3">Widget 3</div>
    </div>

</body>
</html>
