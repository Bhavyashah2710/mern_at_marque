<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wireframe Design</title>
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f0f0f0;
        margin: 0;
    }
    .wireframe-card {
        border: 2px solid #333;
        padding: 20px;
        width: 500px;
        background-color: #fff;
        display: flex;
        flex-direction: column;
        gap: 20px; 
        background-color: #627f86;
    }
    .top-bar {
        width: 100%;
        height: 100px;
        border: 2px solid #333;
        background-color: #e90b0b;
    }
    .middle-section {
        display: flex;
        gap: 15px;
    }
    .middle-box-1 {
        flex: 1.5; 
        height: 60px;
        border: 2px solid #333;
        background-color: #590dd4;
    }
    .bottom-section {
        display: flex;
        align-items: center;
        gap: 120px;
     }
    .shape-circle {
        width: 60px;
        height: 60px;
        border: 2px solid #333;
        border-radius: 50%; 
        background-color: #a6ec03;
    
    }
    .shape-square {
        width: 60px;
        height: 60px;
        border: 2px solid #333;
        background-color: #04d663;
    }
</style>
</head>
<body>

    <div class="wireframe-card">
        
        <div class="top-bar"></div>

        <div class="middle-section">
            <div class="middle-box-1"></div>
            <div class="middle-box-1"></div>
        </div>

        <div class="bottom-section">
            <div class="shape-square"></div>
            <div class="shape-circle"></div>
            <div class="shape-square"></div>
            <div class="shape-circle"></div>
        </div>

    </div>

</body>
</html>
