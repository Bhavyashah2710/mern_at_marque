            background-color: #f1f3f6;

        .wireframe-card {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .top-section {
            background-color: #2874f0;
            padding: 10px 10%;
            display: flex;
            align-items: center;
            gap: 20px;
            height: 50px;
        }
        .shape-reactangle {
            color: white;

            font-size: 22px;
        }
        .shape-reactangle-2 {
            flex: 1;
            padding: 10px;
            background-color: white;
            color: grey;
            border-radius: 2px;
            font-size: 14px;
        }
        .shape-reactangle-3 {
            background: white;
            color: #2874f0;
            padding: 8px 30px;
            font-weight: bold;
            border-radius: 2px;
            text-align: center;
        }
        .shape-reactangle-4 {

        }

        .second-section {
            display: flex;
            justify-content: center;
            gap: 50px;
            background-color: white;
            padding: 15px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .shape-square {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .shape-reaactangle-5 {

            height: 60px;

        .shape-reaactangle-6 {

            height: 250px;
            background-color: #75a4f7;
        }

        .fourth-section {
            background-color: white;
            margin: 0 10px;
            padding: 15px;
            display: flex;
            gap: 15px;
            justify-content: space-between;
        }
        .fifth-section {
            flex: 1;
            border: 1px solid #e0e0e0;
