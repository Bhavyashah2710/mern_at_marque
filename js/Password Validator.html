<!DOCTYPE html>
<html>
<head>
<title>Password Validator</title>
<style>
body{
    font-family: Arial;
    text-align: center;
    margin-top: 100px;
}
input{
    width: 300px;
    padding: 10px;
    font-size: 18px;
}
ul{
    width: 320px;
    margin: 20px auto;
    text-align: left;
    display: none;
}
li{
    margin: 10px 0;
    color: red;
}
.valid{
    color: green;
}
button{
    padding:8px 15px;
    font-size:16px;
    cursor:pointer;
}
</style>
</head>
<body>
<h2>Password Validator</h2>
<input type="password" id="pass" placeholder="Enter Password">
<br><br>
<button id="reset">Reset</button>
<ul id="list">
    <li id="upper">❌ At least one Capital Letter</li>
    <li id="lower">❌ At least one Small Letter</li>
    <li id="number">❌ At least one Number</li>
    <li id="special">❌ At least one Special Character</li>
    <li id="length">❌ At least 8 Characters</li>
</ul>
<script>
let pass = document.getElementById("pass");
let list = document.getElementById("list");
pass.addEventListener("input", function(){
    list.style.display = "block";
    let value = pass.value;
    check(/[A-Z]/,"upper");
    check(/[a-z]/,"lower");
    check(/[0-9]/,"number");
    check(/[!@#$%^&*]/,"special");
    if(value.length >= 8){
        document.getElementById("length").innerHTML="✔ At least 8 Characters";
        document.getElementById("length").className="valid";
    }
    else{
        document.getElementById("length").innerHTML="❌ At least 8 Characters";
        document.getElementById("length").className="";
    }
});
function check(regex,id){
    let item = document.getElementById(id);
    if(regex.test(pass.value)){
        item.innerHTML="✔ "+item.innerHTML.substring(2);
        item.className="valid";
    }
    else{
        item.innerHTML="❌ "+item.innerHTML.substring(2);
        item.className="";
    }
}
let reset = document.getElementById("reset");
reset.addEventListener("click", function(){
    pass.value = "";
    list.style.display = "none";
    document.getElementById("upper").innerHTML = "❌ At least one Capital Letter";
    document.getElementById("lower").innerHTML = "❌ At least one Small Letter";
    document.getElementById("number").innerHTML = "❌ At least one Number";
    document.getElementById("special").innerHTML = "❌ At least one Special Character";
    document.getElementById("length").innerHTML = "❌ At least 8 Characters";
    document.getElementById("upper").className = "";
    document.getElementById("lower").className = "";
    document.getElementById("number").className = "";
    document.getElementById("special").className = "";
    document.getElementById("length").className = "";
});
</script>
</body>
</html>
