<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Move Div</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
}

#box{
    width:50px;
    height:50px; 
    background:red;
    position:absolute;
    left:200px;
    top:200px;
}
</style>
</head>
<body>

<div id="box"></div>

<script>

let box = document.getElementById("box");

let x = 200;
let y = 200;
let speed = 10;

document.addEventListener("keydown",(e)=>{

    if(e.key=="ArrowUp"){
        y -= speed;
    }

    if(e.key=="ArrowDown"){
        y += speed;
    }

    if(e.key=="ArrowLeft"){
        x -= speed;
    }

    if(e.key=="ArrowRight"){
        x += speed;
    }

    box.style.left = x + "px";
    box.style.top = y + "px";

});

</script>

</body>
</html>
