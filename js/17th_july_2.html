<!DOCTYPE html>
<html>
<head>
    <title>Instagram Post</title>

    <style>

        body{
            font-family: Arial;
            background:#e8e8e8;
        }

        #post{
            width:350px;
            background:white;
            border:1px solid gray;
            margin:40px auto;
            padding:10px;
        }

        #top{
            display:flex;
            align-items:center;
            margin-bottom:10px;
        }

        #profile{
            width:50px;
            height:50px;
            border-radius:50%;
            border:2px solid red;
        }

        #name{
            margin-left:10px;
            font-size:18px;
            font-weight:bold;
        }

        #photo{
            width:100%;
            height:350px;
        }

        #buttons{
            margin-top:10px;
        }

        .icon{
            border:none;
            background:none;
            font-size:25px;
            cursor:pointer;
            margin-right:10px;
        }

        #like{
            color:red;
        }

        #likeCount{
            font-size:18px;
            font-weight:bold;
            margin-right:20px;
        }

        #commentBox{
            display:none;
            margin-top:10px;
        }

        textarea{
            width:100%;
            height:60px;
            padding:5px;
        }

        #addComment{
            margin-top:10px;
            padding:8px 15px;
            background:blue;
            color:white;
            border:none;
            cursor:pointer;
            font-size:15px;
        }

        #comments{
            margin-top:15px;
        }

        #comments p{
            background:#f2f2f2;
            padding:8px;
            margin-top:5px;
        }

    </style>

</head>
<body>

<div id="post">

    <div id="top">

        <img id="profile" src="sir.jpg">

        <div id="name">
            username
        </div>

    </div>

    <img id="photo" src="sir.jpg">

    <div id="buttons">

        <button class="icon" id="like">❤️</button>
        <span id="likeCount">0</span>

        <button class="icon" id="commentBtn">💬</button>

        <button class="icon">📤</button>

    </div>

    <div id="commentBox">

        <textarea id="text" placeholder="Write a comment..."></textarea>

        <br>

        <button id="addComment">Post Comment</button>

    </div>

    <div id="comments">

    </div>

</div>

<script>

let like=document.getElementById("like");
let likeCount=document.getElementById("likeCount");

let count=0;

like.addEventListener("click",function(){

    count++;
    likeCount.innerHTML=count;

});



let commentBtn=document.getElementById("commentBtn");
let commentBox=document.getElementById("commentBox");

commentBtn.addEventListener("click",function(){

    if(commentBox.style.display=="block"){

        commentBox.style.display="none";

    }

    else{

        commentBox.style.display="block";

    }

});



let addComment=document.getElementById("addComment");
let text=document.getElementById("text");
let comments=document.getElementById("comments");

addComment.addEventListener("click",function(){

    if(text.value!=""){

        let p=document.createElement("p");

        p.innerHTML=text.value;

        comments.appendChild(p);

        text.value="";

    }

});

</script>

</body>
</html>
