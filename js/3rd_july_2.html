// I want the output in this format
// employee: employee name, spending percentage, amount spent
// employee's juniors: junior name, spending percentage, amount spent
// then after go to another employee and so on
// only this employee's juniors
employees.forEach(employee => {

    let totalInterestCount = uniqueInterests.length;

    let employeeInterestCount = employee.interests.reduce((count, interestObj) => {
        return count + Object.values(interestObj)
            .reduce((innerCount, interests) => {
                return innerCount + interests.length;
            }, 0);
    }, 0);


    let spendingPercentage =
        (employeeInterestCount / totalInterestCount) * 100;

    let amountSpent =
        (spendingPercentage / 100) * employee.salary;


    console.log(
        `Employee: ${employee.name}, Spending Percentage: ${spendingPercentage.toFixed(2)}%, Amount Spent: ${amountSpent.toFixed(2)}`
    );



    // this employee's juniors only
    (employee.junior_assigned || []).forEach(juniorId => {

        let junior = junior_employees.find(
            j => j.employee_id === juniorId
        );

        if (!junior) return;


        let juniorInterestCount = junior.interests.reduce((count, interestObj) => {
            return count + Object.values(interestObj)
                .reduce((innerCount, interests) => {
                    return innerCount + interests.length;
                }, 0);
        }, 0);


        let juniorPercentage =
            (juniorInterestCount / totalInterestCount) * 100;


        let juniorAmount =
            (juniorPercentage / 100) * junior.salary;


        console.log(
            `   Junior: ${junior.name}, Spending Percentage: ${juniorPercentage.toFixed(2)}%, Amount Spent: ${juniorAmount.toFixed(2)}`
        );

    });

        if (!department.items) {
            department.items = {};
        }


        // Employee cart items
        employee.products_in_cart.forEach(product => {

            if (department.items[product.Pname]) {
                department.items[product.Pname]++;
            } else {
                department.items[product.Pname] = 1;
            }

        });


        // Junior cart items of this employee
        if (employee.juniors) {

            employee.juniors.forEach(junior => {

                junior.products_in_cart.forEach(product => {

                    if (department.items[product.Pname]) {
                        department.items[product.Pname]++;
                    } else {
                        department.items[product.Pname] = 1;
                    }

                });

            });

        }

    }

});
