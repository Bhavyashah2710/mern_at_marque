<!DOCTYPE html>
<html>
<head>
<style>
body{
    margin:0;
}
.dot{
    width:20px;
    height:20px;
    background:red;
    position:absolute;
}
</style>
</head>
<body>

<script>
document.addEventListener("mousemove",(e)=>{
    let dot=document.createElement("div");
    dot.className="dot";

    dot.style.left=e.clientX+"px";
    dot.style.top=e.clientY+"px";

    document.body.appendChild(dot);
});
</script>

</body>
</html>
